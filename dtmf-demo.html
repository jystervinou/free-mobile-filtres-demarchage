<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur DTMF</title>
  <style>
    body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { font: inherit; padding: 8px 14px; margin: 0 8px 8px 0; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.5; }
    #sequenceDisplay { white-space: pre-line; font-family: ui-monospace, Menlo, monospace; }
    #current { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Générateur DTMF</h1>
  <p>Joue les codes <code>*351*préfixe#</code> pour chaque préfixe de démarchage.</p>
  <p>Si la liste noire n'est pas encore activée sur votre ligne, jouez d'abord le code d'activation.</p>
  <button id="activateButton">Activer le service (*351#)</button>
  <button id="playAllButton">Jouer tous les codes</button>
  <button id="playNextButton">Jouer le code suivant</button>
  <button id="stopButton">Stop</button>
  <button id="resetButton">Recommencer</button>
  <p id="current"></p>
  <div id="sequenceDisplay"></div>

  <script>
    const dtmfFrequencies = {
      '1': [697, 1209], '2': [697, 1336], '3': [697, 1477], 'A': [697, 1633],
      '4': [770, 1209], '5': [770, 1336], '6': [770, 1477], 'B': [770, 1633],
      '7': [852, 1209], '8': [852, 1336], '9': [852, 1477], 'C': [852, 1633],
      '*': [941, 1209], '0': [941, 1336], '#': [941, 1477], 'D': [941, 1633]
    };
    const prefixes = [
      "0162", "0163", "0270", "0271", "0377",
      "0378", "0424", "0425", "0568", "0569",
      "0948", "0949", "09475", "09476", "09477",
      "09478", "09479"
    ];
    const toneDuration = 0.2;          // secondes par touche
    const pauseBetweenTones = 0.1;     // silence entre deux touches
    const pauseBetweenCodes = 4;       // en mode « tous les codes »
    const toneGain = 0.35;             // par fréquence : la somme reste < 1, sans écrêtage
    const ramp = 0.005;                // montée/descente pour éviter les clics

    const display = document.getElementById('sequenceDisplay');
    const current = document.getElementById('current');
    const buttons = document.querySelectorAll('button');
    let audioContext = null;
    let nextIndex = 0;
    let playing = false;
    let wakeUp = null; // réveille l'attente en cours quand on appuie sur Stop

    class Stopped extends Error {}

    function sleep(ms) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { wakeUp = null; resolve(); }, ms);
        wakeUp = () => { clearTimeout(timer); wakeUp = null; reject(new Stopped()); };
      });
    }

    function getAudioContext() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      return audioContext;
    }

    // Programme une touche sur l'horloge audio (insensible au ralentissement des onglets en arrière-plan).
    function scheduleTone(ctx, [f1, f2], start) {
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(toneGain, start + ramp);
      gain.gain.setValueAtTime(toneGain, start + toneDuration - ramp);
      gain.gain.linearRampToValueAtTime(0, start + toneDuration);
      gain.connect(ctx.destination);
      for (const f of [f1, f2]) {
        const osc = ctx.createOscillator();
        osc.frequency.value = f;
        osc.connect(gain);
        osc.start(start);
        osc.stop(start + toneDuration);
      }
    }

    // Joue une séquence et rend la main quand elle est terminée.
    async function playSequence(sequence) {
      const ctx = getAudioContext();
      await ctx.resume();
      let t = ctx.currentTime + 0.05;
      for (const char of sequence) {
        if (!(char in dtmfFrequencies)) continue;
        scheduleTone(ctx, dtmfFrequencies[char], t);
        t += toneDuration + pauseBetweenTones;
      }
      await sleep((t - ctx.currentTime) * 1000);
    }

    async function playCode(index) {
      const code = `*351*${prefixes[index]}#`;
      current.textContent = `Code ${index + 1}/${prefixes.length} : ${code}`;
      await playSequence(code);
      display.textContent += code + '\n';
    }

    function updateButtons() {
      const done = nextIndex >= prefixes.length;
      document.getElementById('activateButton').disabled = playing;
      document.getElementById('playAllButton').disabled = playing || done;
      document.getElementById('playNextButton').disabled = playing || done;
      document.getElementById('stopButton').disabled = !playing;
      document.getElementById('resetButton').disabled = playing;
      if (done && !playing) current.textContent = 'Terminé.';
    }

    async function run(task) {
      if (playing) return;
      playing = true;
      updateButtons();
      try {
        await task();
      } catch (e) {
        if (!(e instanceof Stopped)) throw e;
        current.textContent = 'Arrêté.';
      } finally {
        playing = false;
        updateButtons();
      }
    }

    document.getElementById('stopButton').addEventListener('click', () => {
      // Fermer le contexte coupe immédiatement les sons déjà programmés.
      if (audioContext) { audioContext.close(); audioContext = null; }
      if (wakeUp) wakeUp();
    });

    document.getElementById('activateButton').addEventListener('click', () => run(async () => {
      current.textContent = 'Activation : *351#';
      await playSequence('*351#');
      display.textContent += '*351#\n';
      current.textContent = '';
    }));

    document.getElementById('playNextButton').addEventListener('click', () => run(async () => {
      await playCode(nextIndex);
      nextIndex++;
    }));

    document.getElementById('playAllButton').addEventListener('click', () => run(async () => {
      while (nextIndex < prefixes.length) {
        await playCode(nextIndex);
        nextIndex++;
        if (nextIndex < prefixes.length) await sleep(pauseBetweenCodes * 1000);
      }
    }));

    document.getElementById('resetButton').addEventListener('click', () => {
      nextIndex = 0;
      display.textContent = '';
      current.textContent = '';
      updateButtons();
    });

    updateButtons();
  </script>
</body>
</html>
